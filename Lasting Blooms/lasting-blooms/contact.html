<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact Lasting Blooms by Malaki to place an order.">
  <title>Contact | Lasting Blooms</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/background.css">
</head>
<body>

  <header>
    <nav class="container nav-bar">
      <a href="index.html" class="logo-link">
        <img src="images/logo.png" alt="Lasting Blooms logo, a purple M inside a circle of flowers" class="logo-img">
        <span>Lasting Blooms</span>
      </a>
      <button class="menu-button" aria-label="Open menu">&#9776;</button>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="shop.html">Shop</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
        <li><a href="shop.html#cart">Cart (<span id="cart-count">0</span>)</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section>
      <div class="container two-columns">
        <div>
          <h1>Contact Us</h1>
          <p>Want to order or ask a question? Fill in the form and we will get back to you.</p>
          <br>
          <p>Instagram: <a href="https://www.instagram.com" target="_blank" rel="noopener">Lasting Blooms</a></p>
          <p>Location: Lebanon</p>
        </div>

        <form id="contact-form">
          <label for="name">Name</label>
          <input type="text" id="name" placeholder="Your name">

          <label for="email">Email</label>
          <input type="text" id="email" placeholder="Your email">

          <label for="message">Message</label>
          <textarea id="message" rows="5" placeholder="Your message"></textarea>

          <p class="error-text" id="error"></p>
          <button type="submit" class="button">Send</button>
          <p class="success-text" id="success"></p>
        </form>
      </div>
    </section>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2026 Lasting Blooms by Malaki</p>
      <p><a href="contact.html">Contact</a> | <a href="https://www.instagram.com" target="_blank" rel="noopener">Instagram</a></p>
    </div>
  </footer>

  <script src="js/background.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
